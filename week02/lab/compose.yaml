# 4장 실습 인프라: MinIO → SeaweedFS, Redis → Valkey, MLflow 최신(3.17.2)
name: ch4-lab
services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.51
    # master + volume + filer + S3 게이트웨이를 한 프로세스로
    command: server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -volume.max=0
    ports: ["8333:8333"]
    volumes:
      - seaweed-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 5s
      retries: 20

  valkey:
    image: valkey/valkey:9.1.3
    command: valkey-server --requirepass valkeypass --appendonly yes
    ports: ["6379:6379"]
    volumes: [valkey-data:/data]

  mlflow:
    build: ./mlflow-server
    image: ch4-lab/mlflow:3.17.2
    depends_on:
      seaweedfs: {condition: service_healthy}
    environment:
      MLFLOW_S3_ENDPOINT_URL: http://seaweedfs:8333
      AWS_ACCESS_KEY_ID: seaweed
      AWS_SECRET_ACCESS_KEY: seaweed123
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination s3://mlflow-artifacts
      --serve-artifacts
    ports: ["5000:5000"]
    volumes: [mlflow-db:/mlflow]

volumes:
  seaweed-data:
  valkey-data:
  mlflow-db:
